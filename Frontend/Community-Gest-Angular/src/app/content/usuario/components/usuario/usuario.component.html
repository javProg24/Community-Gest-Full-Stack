<div class="buttons">
    <h1><strong>Modulo de {{title}}</strong></h1>
    <button mat-flat-button color="acceent" (click)="agregarUsuario()">
        <mat-icon>add</mat-icon>
        Nuevo
    </button>
</div>
<div class="table-section">
    <tabla-reutilizable
    [Titulo]="title+'s'"
    [data]="usuariosDatos"
    [columns]="tablaColumnas"
    [isLoading]="isLoading"
    [isVisibleEditar]="isVisibleEditar"
    [isVisibleEliminar]="isVisibleEliminar"
    (action)="onAction($event)"/>
</div>
