<h1 class="title">
    <strong>Registros de {{title}}</strong>
</h1>
<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table style="border-radius: 58px; " mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        @for (col of columns(); track $index) {
            <ng-container matColumnDef="{{col.def}}">
                <th style="background-color: rgb(87,238,163)" mat-header-cell *matHeaderCellDef>
                    {{col.label|capitalize}}
                </th>
                <td mat-cell *matCellDef="let row">
                    {{col.content(row)}}
                </td>
            </ng-container>
        }
        <ng-container matColumnDef="Acciones">
            <th style="background-color: rgb(87,238,163)"
            mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row" class="action-buttons">
                <button class="edit-button" mat-flat-button (click)="onAction(Editar,row)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button class="delete-button" mat-flat-button (click)="onAction(Eliminar,row)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns:displayedColumns()"></tr>
        
    </table>
    <mat-paginator [length]="25" [pageSize]="[10,7,20]" aria-label="Select page" showFirstLastButtons="">
    </mat-paginator>
</div>
